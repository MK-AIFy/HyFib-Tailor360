<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the shell can pad itself with the safe-area insets on notched phones;
         interactive-widget=resizes-content keeps the focused field visible when the on-screen
         keyboard opens (WCAG 2.4.11, plan #50). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="HyFib Tailor360 — tailoring shop management" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f3d3e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07211f" media="(prefers-color-scheme: dark)" />
    <!-- iOS ignores most of the web manifest, so installed mode needs these tags as well (plan #50).
         mobile-web-app-capable is the standard spelling every other engine reads; the apple-prefixed
         one stays because Safari still reads only that. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tailor360" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- Its own artwork: iOS masks the icon itself and discards the alpha channel, so a rounded,
         transparent-cornered PNG lands on the home screen sitting in a black square. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <title>HyFib Tailor360</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>
        HyFib Tailor360 needs JavaScript. Please enable it in your browser settings and reload this
        page, or ask your shop administrator for help.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
