name: CI

# Continuous integration: build, format, test, and the security and quality gates of Section 5.
#
# Issue #20 built the first four jobs. Issue #22 added the per-project coverage floor, the Prettier
# check, the migration check, CodeQL, Trivy and the software bill of materials. Each of the added
# gates is a separate job rather than more steps inside `security`, so that a red status names the
# gate that failed, the jobs run in parallel rather than in series, and each holds only the token
# permissions it needs.
#
# The budget in Section 5.3 is 15 minutes of wall clock for a pull-request pipeline. That is the
# target, not a measurement: the timeouts below (30 for the .NET job, 25 for CodeQL, 20 for the
# bill of materials and the migration check, 15 for the rest) are ceilings that stop a hung job,
# and they permit considerably more than the budget. `docs/process/workflow-demo.md` section 7 is
# where the real per-job durations are recorded; until it has numbers, nothing here should be read
# as a claim that the pipeline fits.
#
# `pull_request` (never `pull_request_target`): `pull_request_target` runs with the base
# repository's secrets and a write-scoped token, so checking out the pull-request head under it
# would hand any fork write access to this repository.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Least privilege. The workflow token may read the repository and nothing else; no job here needs
# more, so no job overrides this. A job that later needs to write (a comment, a release asset,
# `id-token` for signing) raises exactly that permission in its own `permissions:` block rather
# than here.
permissions:
  contents: read

# One run per ref: a second push to the same branch cancels the run already in flight, which saves
# runner minutes and keeps the queue short — both of which the 15-minute budget of Section 5
# depends on, though neither on its own proves the budget is met.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  # The coverage tool has its own telemetry and banner, opted out of for the same reason.
  DOTNET_COVERAGE_TELEMETRY_OPTOUT: "1"
  DOTNET_COVERAGE_NOLOGO: "1"
  # Pinned so a coverage-tool release cannot change a build's result without a commit.
  DOTNET_COVERAGE_VERSION: "18.11.0"

# ADVANCED SECURITY
# Two things this workflow would like to use need GitHub Advanced Security, which a private
# repository owned by a personal account cannot have: the code-scanning alerts page that SARIF is
# published to, and the dependency graph the dependency review compares. Every step that needs one
# of them is opt-in behind a repository variable — `CODE_SCANNING_ENABLED` and
# `DEPENDENCY_REVIEW_ENABLED` — because a step that fails on every run for a reason no code change
# can fix trains reviewers to ignore a red security job.
#
# What is *not* made optional is the scanning. CodeQL and Trivy run on every pull request either
# way; only the publication of their findings is gated. When the variable is off, the findings are
# written into the job summary by `scripts/sarif-gate.py`, uploaded as an artefact, and still fail
# the build at the severity each job gates on — and the step that would have published them says so
# in a warning, because a silently skipped security check is indistinguishable from a passing one.

# ACTION PINNING POLICY
# Every third-party action is referenced by the full 40-character commit SHA of a released tag,
# with the tag in a trailing comment. A tag is a mutable pointer: whoever can move it can run new
# code inside this workflow with the workflow token, so the SHA is the only reference that is
# actually immutable. Dependabot (`.github/dependabot.yml`, `github-actions` ecosystem) raises the
# pins on a schedule and rewrites both the SHA and the comment, so pinning does not mean going
# stale. Resolve a SHA yourself with:
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq '.object.sha'
# (for an annotated tag, dereference it: `gh api repos/<owner>/<repo>/git/tags/<sha> --jq '.object.sha'`).

jobs:
  build-test-dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # PostgreSQL 16, the version the application targets. Pinned by digest as well as tag so the
      # database the Integration tier runs against cannot change under a rerun of an old commit.
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          # `trust` keeps a password — even a throwaway one — out of the repository entirely, and
          # matches how the development instance is configured. The container is reachable only
          # from this job's network for the life of the job.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: tailor360_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tailor360_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The Integration tier skips when no database is reachable, which would be a green build over
      # unverified code. `CI=true` turns that skip into a failure (see
      # tests/Tailor360.IntegrationTests/DatabaseAvailability.cs). GitHub sets CI=true already;
      # it is repeated here because the guarantee is deliberate, not incidental.
      CI: "true"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # global.json is the single source of truth for the SDK version (10.0.100,
          # rollForward latestFeature), so CI and developer machines cannot drift.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HyFib.Tailor360.slnx

      - name: Verify formatting
        # Style is enforced from .editorconfig. `--verify-no-changes` exits non-zero instead of
        # rewriting files, so a formatting failure is reported rather than silently fixed in CI.
        run: dotnet format HyFib.Tailor360.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Build
        id: build
        # Directory.Build.props already sets TreatWarningsAsErrors; -warnaserror also promotes the
        # warnings raised outside project compilation (restore, MSBuild, source generators).
        run: dotnet build HyFib.Tailor360.slnx --configuration Release --no-restore -warnaserror

      - name: Install the coverage collector
        # The test projects run on Microsoft.Testing.Platform without the code-coverage extension,
        # so coverage is collected by wrapping the run in the dotnet-coverage global tool. That
        # keeps coverage out of the project files and works identically for every tier.
        run: |
          dotnet tool install --global dotnet-coverage --version "$DOTNET_COVERAGE_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Test tiers are separate steps so a failure names the tier. The tier boundary is the project
      # boundary (Unit, Architecture, Contract, Integration), which is also what the `Category`
      # traits record. Each tier runs even when an earlier tier failed — one push should report
      # every broken tier at once — but none runs when the build itself failed, because
      # `--no-build` would then report a confusing missing-assembly error instead.
      - name: Unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet-coverage collect
          --output-format cobertura
          --output artifacts/coverage/unit.cobertura.xml
          --
          dotnet test --project tests/Tailor360.UnitTests
          --configuration Release --no-build
          --results-directory artifacts/test-results
          --report-xunit-trx --report-xunit-trx-filename unit.trx

      - name: Architecture tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet-coverage collect
          --output-format cobertura
          --output artifacts/coverage/architecture.cobertura.xml
          --
          dotnet test --project tests/Tailor360.ArchitectureTests
          --configuration Release --no-build
          --results-directory artifacts/test-results
          --report-xunit-trx --report-xunit-trx-filename architecture.trx

      - name: Contract tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet-coverage collect
          --output-format cobertura
          --output artifacts/coverage/contract.cobertura.xml
          --
          dotnet test --project tests/Tailor360.ContractTests
          --configuration Release --no-build
          --results-directory artifacts/test-results
          --report-xunit-trx --report-xunit-trx-filename contract.trx

      - name: Integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          # The service container above. Supplying this variable is what makes the tier run instead
          # of falling back to Testcontainers; with CI=true an unreachable database fails the job.
          # TAILOR360_TEST_S3_ENDPOINT is deliberately absent until the Media module needs MinIO.
          TAILOR360_TEST_DATABASE_URL: "Host=localhost;Port=5432;Database=tailor360_test;Username=postgres"
        run: >-
          dotnet-coverage collect
          --output-format cobertura
          --output artifacts/coverage/integration.cobertura.xml
          --
          dotnet test --project tests/Tailor360.IntegrationTests
          --configuration Release --no-build
          --results-directory artifacts/test-results
          --report-xunit-trx --report-xunit-trx-filename integration.trx

      - name: Summarise the test tiers
        if: ${{ !cancelled() }}
        run: |
          # The TRX counters are the run's own record, so the summary cannot disagree with it.
          # `notExecuted` is how TRX records a skipped test.
          {
            echo "## .NET test tiers"
            echo
            echo "| Tier | Total | Passed | Failed | Skipped |"
            echo "| --- | ---: | ---: | ---: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          shopt -s nullglob
          reports=(artifacts/test-results/*.trx)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "| _no test report was produced_ | - | - | - | - |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for report in "${reports[@]}"; do
            tier=$(basename "$report" .trx)
            counters=$(grep -o '<Counters[^>]*>' "$report" | head -n 1 || true)
            value() { printf '%s' "$counters" | sed -n "s/.*$1=\"\([0-9]*\)\".*/\1/p"; }
            printf '| %s | %s | %s | %s | %s |\n' \
              "$tier" "$(value total)" "$(value passed)" "$(value failed)" "$(value notExecuted)" \
              >> "$GITHUB_STEP_SUMMARY"
          done

          # Failing test names save a trip into the raw log.
          failures=$(grep -ho 'testName="[^"]*" outcome="Failed"' "${reports[@]}" \
            | sed 's/testName="//; s/" outcome="Failed"//' | sort -u || true)
          if [ -n "$failures" ]; then
            {
              echo
              echo "### Failed tests"
              echo
              printf '%s\n' "$failures" | sed 's/^/- `/; s/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-test-results
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-coverage
          path: artifacts/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Prove the coverage checker still detects a shortfall
        # Same reasoning as the documentation link checker: a gate that has quietly stopped
        # detecting is indistinguishable from code that meets it. The self-test runs the checker
        # over a report it knows the answer to before the real report is trusted.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/coverage-floor.py --self-test

      - name: Enforce the per-project coverage floor
        # Runs after the uploads so that a failure here still leaves the reports downloadable.
        #
        # The floors are in .github/coverage-floors.json, each one measured on this repository
        # rather than chosen: the file records what the project achieved and puts the floor two to
        # three points under it. They ratchet upward — the checker prints a notice naming any
        # project that has outgrown its floor.
        #
        # These numbers are the measured baseline DOD-OD-02 in docs/process/definition-of-done.md
        # was waiting for; the decision itself stays "proposed, to be confirmed" until its owner
        # confirms it. Lowering a floor is a change under /.github/, which CODEOWNERS would route
        # to a reviewer — but CODEOWNERS applies none of its rules on this repository today (see
        # docs/process/branch-protection.md section 5.2, BP-OD-03), so that routing is a convention
        # until BP-OD-03 is answered, not an enforced control.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/coverage-floor.py artifacts/coverage

  build-test-pwa:
    name: PWA build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: clients/pwa

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm is installed before Node so that setup-node's pnpm cache can find the store.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # No `version:` input on purpose: clients/pwa/package.json pins pnpm through its
          # `packageManager` field, and passing both makes this action fail with a conflict.
          # Paths given to an action are workspace-relative; `defaults.run` applies to run steps only.
          package_json_file: clients/pwa/package.json
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: clients/pwa/pnpm-lock.yaml

      - name: Install dependencies
        id: install
        # --frozen-lockfile fails rather than updating the lockfile, so CI installs exactly what
        # was reviewed.
        run: pnpm install --frozen-lockfile

      # Every check below runs even when an earlier one failed, for the same reason the .NET test
      # tiers do: one push should report every broken check at once. Without this a single Prettier
      # nit would abort the job and say nothing about whether the code lints, type-checks, tests or
      # builds. None of them runs when the install failed, because they would all then fail with a
      # missing-module error that hides the real cause.
      - name: Check formatting
        # Prettier owns formatting in this tree (clients/pwa/.prettierrc.json), and ESLint carries
        # no formatting rules, so `pnpm lint` passing says nothing about it. `--check` reports
        # rather than rewrites, which is the counterpart of `dotnet format --verify-no-changes`
        # above: a formatting failure is reported, not silently fixed in CI.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Check the generated API types against the published document
        # src/api/schema.d.ts is generated from docs/api/openapi.v1.json, and src/api/contract.ts
        # pins the hand-written payload types against it — which is what makes a contract change
        # fail the type check rather than fail on a shop floor. Regenerating and diffing is what
        # keeps the committed types honest: a document that moved without a regeneration leaves the
        # conformance assertions checking against yesterday's contract, and they would still pass.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm generate:api:check

      - name: Type-check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

      - name: Upload the build output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pwa-dist
          path: clients/pwa/dist/
          if-no-files-found: error
          retention-days: 14

  documentation:
    name: Documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # No token is used at all: the check reads files out of the checkout and nothing else.
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove the link checker still detects a broken link
        # A checker that has quietly stopped detecting is indistinguishable from a repository with
        # no broken links: both are silent and green. The self-test runs the detector over a
        # known-bad document and fails unless it finds exactly the two genuine breaks and ignores
        # the external, anchor, mailto and fenced-code links it is meant to ignore.
        run: python3 scripts/check-docs-links.py --self-test

      - name: Check that relative documentation links resolve
        # The first documentation change carried ten broken relative links through review
        # unnoticed, two of them pointing at documents a document map declared as deliverables and
        # that nobody had written. A reader following such a link learns nothing while the map
        # still reads as a complete set, so the gap is invisible exactly where it matters. Only
        # relative links are checked: an external URL is somebody else's uptime and would fail
        # builds for reasons no commit here can fix.
        run: python3 scripts/check-docs-links.py

  api-contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The committed OpenAPI document is the published contract: it is what the progressive web
    # application's types are generated from and what a reviewer reads to see the shape of a change.
    # That the document matches the running application is asserted by the Contract tier in the
    # .NET job, which regenerates it in process and compares. This job asks the other question, the
    # one no single commit can answer on its own: how the contract changed since the base branch.
    #
    # Inside a major version only additive changes are permitted (docs/architecture/conventions.md
    # section 5.2). A breaking change needs the api-breaking-approved label from a CODEOWNER of
    # docs/api/ and a row in docs/api/breaking-changes.md naming this pull request; either alone is
    # not enough, because a label leaves no record and a record nobody approved is a note to self.
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch has to be reachable to be diffed against.
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the diff gate still detects a breaking change
        # Same reasoning as the link checker and the coverage floor: a gate that has quietly stopped
        # detecting reports a clean contract and a broken one identically. The self-test runs the
        # classifier over twenty-three changes whose answers are known before the real diff is
        # trusted.
        run: python3 scripts/openapi-diff.py --self-test

      - name: Take the document from the base branch
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}
        run: |
          # A pull request that introduces the document has nothing to diff against, and neither
          # does the first commit on a branch: an empty file means "every operation is new", which
          # the script says out loud rather than treating as a clean diff.
          mkdir -p artifacts/api
          git show "$BASE_REF:docs/api/openapi.v1.json" > artifacts/api/base.json 2>/dev/null \
            || : > artifacts/api/base.json

      - name: Classify the contract change
        env:
          # The label is read from the pull-request payload rather than queried, so this job needs
          # no token at all.
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking-approved') }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          # Without pipefail the exit status of the pipeline is tee's, which is always zero — and a
          # gate that cannot fail is not a gate.
          set -o pipefail
          arguments=(--base artifacts/api/base.json --head docs/api/openapi.v1.json)
          arguments+=(--register docs/api/breaking-changes.md)
          if [ -n "$PULL_REQUEST" ]; then
            arguments+=(--pr "$PULL_REQUEST")
          fi
          if [ "$APPROVED" = "true" ]; then
            arguments+=(--approved)
          fi
          python3 scripts/openapi-diff.py "${arguments[@]}" | tee artifacts/api/diff.txt

      - name: Summarise the contract change
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## API contract"
            echo
            echo '```'
            cat artifacts/api/diff.txt 2>/dev/null || echo "the diff produced no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint the published document
        # The same rules the Contract tier asserts in process, declared in the format the wider
        # ecosystem reads. Spectral is fetched from the registry, so this step is the one part of
        # the API gate that depends on the network; it is deliberately not the only enforcement of
        # these rules — docs/api/openapi-gates.md records why both exist.
        run: npx --yes @stoplight/spectral-cli@6 lint docs/api/openapi.v1.json --ruleset .spectral.yaml

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # gitleaks lists the commits of the pull request to decide what to scan, and the dependency
    # review compares the base and head dependency graphs. Both need to read pull-request metadata;
    # the workflow-level default of `contents: read` alone makes them fail with a 403 that reads
    # like a bug in the action. Read access is the whole grant: neither writes anything.
    permissions:
      contents: read
      pull-requests: read

    # This job stays at the two checks that need nothing but a read-only token. CodeQL, Trivy and
    # the bill of materials are their own jobs below, because they need `security-events: write`
    # and there is no reason for secret scanning to hold a token that can write security events.
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history, not just the working tree, so the full history is needed.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets (gitleaks)
        # The rule set is the default one, extended by `.gitleaks.toml` at the repository root, which
        # gitleaks picks up on its own. That file allowlists exact literal values — the documented
        # example payloads and the integration-test account password — and never a file or a rule, so a
        # real credential added beside one of them still fails this job.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks is free for personal repositories; an organisation-owned repository needs a
          # (free) licence key stored as this secret, otherwise the step fails asking for it.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # No pull-request comments: the finding belongs in the job log and the branch-protection
          # status, and commenting would need `pull-requests: write` on every run.
          GITLEAKS_ENABLE_COMMENTS: "false"
          # The action's own artifact upload uses a deprecated upload-artifact version. The
          # findings are in the job log and the step's exit code is the gate, so nothing is lost by
          # turning it off; the SARIF path would need the code-scanning alerts page this repository
          # does not have.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Report that dependency review is not enabled
        # Visible rather than silent. A skipped check that nobody can see is indistinguishable from a
        # passing one, and this is a security gate.
        if: ${{ github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED != 'true' }}
        run: |
          echo "::warning title=Dependency review not enabled::The dependency graph is not available \
          on this repository, so new dependencies are not being checked against advisories."
          {
            echo "### Dependency review is not running"
            echo
            echo "This repository does not have the dependency graph available, which the check needs."
            echo "On a private repository that means GitHub Advanced Security."
            echo
            echo "To turn the gate on:"
            echo "1. Enable the dependency graph under Settings → Code security."
            echo "2. Set the repository variable \`DEPENDENCY_REVIEW_ENABLED\` to \`true\`."
            echo
            echo "Until then a new dependency with a known high-severity advisory would not be caught"
            echo "here. The Trivy dependency scan in the \`Container and dependency scan\` job is what"
            echo "covers it in the meantime. No waiver has been granted for this gap; record one in"
            echo "\`docs/process/waivers.md\` if it is still open at the first release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Review dependency changes
        # Compares the dependency graph of the base and head commits and fails on a vulnerable or
        # disallowed new dependency. It is a pull-request-only check and needs the dependency graph,
        # which on a private repository means GitHub Advanced Security. The repository variable makes
        # it opt-in: the alternative was a step that fails on every run for a reason no code change can
        # fix, which trains reviewers to ignore a red security job.
        if: ${{ github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  migration-check:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Reads the repository and nothing else. The database it talks to is a service container that
    # exists for the length of this job.
    permissions:
      contents: read

    services:
      # A database of its own, empty, so that "the migrations apply to an empty database" is what is
      # actually tested. The test job's database has been written to by the Integration tier and
      # would hide a migration that only works against an already-migrated schema. Same digest pin
      # as that job: the schema must be proved against the PostgreSQL version production runs.
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: tailor360_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tailor360_migrations"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The command line reads the same configuration the hosts read, so the connection string
      # arrives the way it does in a deployment: as an environment variable whose `__` separator
      # maps onto the `Database:ConnectionString` configuration key. Nothing is passed on the
      # command line, where it would land in the process list.
      Database__ConnectionString: "Host=localhost;Port=5432;Database=tailor360_migrations;Username=postgres"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore and build the command line
        # Only the command line and what it references, not the whole solution: this job proves the
        # migrations, and the .NET job already proves the build. Building the tool also builds
        # Tailor360.Platform.Persistence into its own output directory, which is what the EF Core
        # tooling below loads with --no-build.
        run: |
          dotnet restore src/Tools/Tailor360.Cli
          dotnet build src/Tools/Tailor360.Cli --configuration Release --no-restore

      - name: Install the EF Core tooling
        # The tool version has to match the EF Core packages, so it is read from the central package
        # versions rather than repeated here, where the two would drift apart silently.
        run: |
          version=$(sed -n \
            's/.*Include="Microsoft.EntityFrameworkCore.Design"[[:space:]]*Version="\([^"]*\)".*/\1/p' \
            Directory.Packages.props | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::No EntityFrameworkCore.Design version in Directory.Packages.props."
            exit 1
          fi
          echo "Installing dotnet-ef $version."
          dotnet tool install --global dotnet-ef --version "$version"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Apply the migrations to an empty database
        id: apply
        # The real command an operator and the deployment both run, not a re-implementation of it.
        # Migrations are applied by this tool rather than at application start-up so that a rolling
        # deployment cannot have two versions racing to change the schema.
        run: dotnet run --project src/Tools/Tailor360.Cli --configuration Release --no-build -- migrate

      - name: Check that a second run changes nothing
        # A migration that is not idempotent fails the second deployment, not the first, which is
        # the worst time to find out. Both assertions are on the tool's own words: `migrate` says
        # "already up to date" per schema when it applied nothing, and `--dry-run` reports what
        # would be applied without applying it.
        run: |
          set -o pipefail
          dotnet run --project src/Tools/Tailor360.Cli --configuration Release --no-build \
            -- migrate | tee second-run.log
          dotnet run --project src/Tools/Tailor360.Cli --configuration Release --no-build \
            -- migrate --dry-run | tee dry-run.log

          if grep -q "applied" second-run.log; then
            echo "::error title=Migrations are not idempotent::A second migrate applied something."
            exit 1
          fi

          if ! grep -q "The database is up to date with this build." dry-run.log; then
            echo "::error title=Migrations are not idempotent::migrate --dry-run still reports work."
            exit 1
          fi

      - name: Check that the model has no pending changes
        # Compares the entity configuration against PlatformDbContextModelSnapshot and exits
        # non-zero when they disagree, which is the state where the code expects a schema no
        # migration builds. Without this check that only shows up at run time, as a column the
        # application reads and the database does not have.
        #
        # It is a design-time check and needs no database. The persistence project is its own
        # startup project because that is where PlatformDbContextFactory lives, and that factory
        # uses a placeholder connection string, so this cannot reach a real database by accident.
        #
        # One thing it does not cover: an entity mapped with ExcludeFromMigrations — the audit
        # table is one — is outside the model differ entirely, so a change to its configuration is
        # invisible here and has to be carried by hand-written SQL in a migration.
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Platform/Tailor360.Platform.Persistence
          --startup-project src/Platform/Tailor360.Platform.Persistence
          --context PlatformDbContext
          --configuration Release
          --no-build

      - name: Record the schema the migrations produced
        # A dump of the schema the migrations actually built, so that a reviewer can see what a
        # migration did rather than infer it from the C#. `--schema-only` because the database holds
        # no data at this point and never should: nothing seeds it here.
        #
        # This is a reporting step, not a gate. It does not fail the job when pg_dump is missing,
        # because losing the report is not a reason to reject a migration that applied cleanly.
        # Comparing the dump against a committed fixture — the `tests/fixtures/db-snapshots/`
        # directory docs/dev/migrations.md describes — is not done here: pg_dump output carries the
        # server's own version banner, so the comparison needs a normalisation step that is worth
        # writing only once there is a schema worth diffing.
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        run: |
          if ! command -v pg_dump > /dev/null; then
            echo "::warning title=Schema dump skipped::pg_dump is not on this runner."
            exit 0
          fi

          mkdir -p artifacts/db-snapshots
          pg_dump --schema-only --no-owner --no-privileges \
            "postgresql://postgres@localhost:5432/tailor360_migrations" \
            > artifacts/db-snapshots/tailor360-schema.sql

          migrations=$(find src/Platform/Tailor360.Platform.Persistence/Migrations \
            -name '*.cs' ! -name '*.Designer.cs' ! -name '*ModelSnapshot.cs' | wc -l)
          tables=$(grep -c '^CREATE TABLE' artifacts/db-snapshots/tailor360-schema.sql || true)

          {
            echo "## Database migrations"
            echo
            echo "Applied to an empty PostgreSQL 16 database, applied a second time to prove the"
            echo "run is idempotent, and the model checked against the migration snapshot."
            echo
            echo "| Measure | Value |"
            echo "| --- | ---: |"
            echo "| Migrations in this build | ${migrations} |"
            echo "| Tables in the resulting schema | ${tables} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the schema snapshot
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-schema
          path: artifacts/db-snapshots/
          if-no-files-found: warn
          retention-days: 14

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      # Only for the SARIF upload, and only when CODE_SCANNING_ENABLED is on. The scan itself needs
      # nothing but read access.
      security-events: write
      # CodeQL reads the workflow run's own metadata to label the analysis. Without this the action
      # fails on a private repository with a 403 that reads like a bug in the action.
      actions: read

    strategy:
      # One language failing must not hide the other language's findings.
      fail-fast: false
      matrix:
        # `javascript-typescript` is one language to CodeQL, and covers clients/pwa.
        language: [csharp, javascript-typescript]

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove the SARIF gate still detects a finding
        # The gate below is what makes this scan a build result rather than a report. A gate that
        # has quietly stopped detecting is indistinguishable from code with nothing wrong with it,
        # so it proves itself against a report it knows the answer to first.
        run: python3 scripts/sarif-gate.py --self-test

      - name: Prepare the report directory
        run: mkdir -p artifacts/security/codeql

      - name: Initialise CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          # No build. C# analysis without a build is supported and is much the cheaper of the two
          # modes; building the 66-project solution a second time here would add minutes for
          # findings the .NET job's compiler warnings already cover. How much it actually costs is
          # measured in workflow-demo.md section 7, not asserted here. The trade-off
          # is that source generated during the build is not analysed, which is acceptable while the
          # only generated code is the OpenAPI comment support the coverage floor also excludes.
          build-mode: none

      - name: Analyse
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
          # The SARIF is always written to disk, whether or not it can be published, because the
          # gate below reads it from there.
          output: artifacts/security/codeql
          # Publishing needs Advanced Security. Attempting it without makes the step fail with a
          # 403 on every run; see the ADVANCED SECURITY note at the top of this file.
          upload: ${{ vars.CODE_SCANNING_ENABLED == 'true' && 'always' || 'never' }}

      - name: Upload the CodeQL report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: artifacts/security/codeql/
          if-no-files-found: warn
          retention-days: 14

      - name: Report that code scanning alerts are not enabled
        # Visible rather than silent, for the same reason the dependency-review notice is: a check
        # whose findings go nowhere looks exactly like a check that found nothing.
        if: ${{ !cancelled() && vars.CODE_SCANNING_ENABLED != 'true' }}
        run: |
          echo "::warning title=Code scanning alerts not enabled::CodeQL ran and gates this build, \
          but its findings cannot be published to the alerts page, so there is no history and no \
          triage there."
          {
            echo "### CodeQL findings are not being published"
            echo
            echo "The scan ran and failed the build if it found anything at high severity or above."
            echo "What is missing is the alerts page: publishing SARIF needs GitHub Advanced"
            echo "Security, which a private repository owned by a personal account cannot have."
            echo
            echo "Until then the findings are in the job summary above and in the"
            echo "\`codeql-sarif-${{ matrix.language }}\` artefact, and there is no alert history"
            echo "and no dismissal trail."
            echo
            echo "To turn publication on:"
            echo "1. Enable code scanning under Settings → Code security."
            echo "2. Set the repository variable \`CODE_SCANNING_ENABLED\` to \`true\`."
            echo
            echo "The scan itself still gates this build, so nothing is being carried silently. No"
            echo "waiver has been granted for the missing alerts page; record one in"
            echo "\`docs/process/waivers.md\` if it is still missing at the first release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate on the CodeQL findings
        # Reads the SARIF the analysis wrote and fails at high severity or above, so the scan gates
        # the build whether or not the alerts page is available. A finding is either fixed or
        # waived under docs/process/waivers.md; nothing is dismissed by lowering this number.
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/sarif-gate.py artifacts/security/codeql
          --label "CodeQL: ${{ matrix.language }}"
          --fail-on-severity 7.0

  infrastructure-scan:
    name: Container and dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      # Only for the SARIF upload, and only when CODE_SCANNING_ENABLED is on.
      security-events: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove the SARIF gate still detects a finding
        # Same reasoning as in the CodeQL job: the gate proves itself before it is trusted.
        run: python3 scripts/sarif-gate.py --self-test

      - name: Prepare the report directory
        # Trivy writes its report with a plain file create, which fails when the directory is not
        # already there.
        run: mkdir -p artifacts/security/trivy

      - name: Scan the container definitions
        # Trivy's configuration scanner reads the Dockerfiles under infra/docker (it matches
        # `Dockerfile.*` as well as `Dockerfile`) and any other infrastructure format it recognises
        # there. It has no policy set for Compose or for the Caddyfile, so those two are read by the
        # filesystem scan below and by gitleaks, not by this step — saying otherwise here would
        # claim coverage the tool does not provide.
        #
        # exit-code stays 0 and the gate is applied afterwards from the SARIF, so that one run
        # produces both the report and the build result and every finding reaches the summary
        # whatever its severity.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          format: sarif
          output: artifacts/security/trivy/config.sarif
          exit-code: "0"

      - name: Scan the dependency tree
        # This is the gate that the disabled dependency review would otherwise have been. Trivy
        # reads clients/pwa/pnpm-lock.yaml directly — no install, no dependency graph, no Advanced
        # Security — and reports the known advisories against it.
        #
        # Secret scanning is left off here because gitleaks already scans the whole history in the
        # security job, and two secret scanners means two sets of false positives to triage for one
        # signal. `ignore-unfixed` keeps the gate to advisories somebody can actually clear: a
        # permanently red job for a vulnerability with no released fix teaches people to ignore it.
        # Those are handled through docs/process/waivers.md instead.
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          ignore-unfixed: true
          format: sarif
          output: artifacts/security/trivy/dependencies.sarif
          exit-code: "0"
          # The binary and the vulnerability database the previous step installed are reused.
          skip-setup-trivy: true

      - name: Upload the Trivy reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-sarif
          path: artifacts/security/trivy/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish the Trivy findings to code scanning
        if: ${{ !cancelled() && vars.CODE_SCANNING_ENABLED == 'true' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: artifacts/security/trivy
          category: trivy

      - name: Report that code scanning alerts are not enabled
        if: ${{ !cancelled() && vars.CODE_SCANNING_ENABLED != 'true' }}
        run: |
          echo "::warning title=Code scanning alerts not enabled::Trivy ran and gates this build, \
          but its findings cannot be published to the alerts page, so there is no history and no \
          triage there."
          {
            echo "### Trivy findings are not being published"
            echo
            echo "The scans ran and failed the build at the severities the job gates on. What is"
            echo "missing is the alerts page: publishing SARIF needs GitHub Advanced Security,"
            echo "which a private repository owned by a personal account cannot have."
            echo
            echo "Until then the findings are in the job summary above and in the \`trivy-sarif\`"
            echo "artefact. Set the repository variable \`CODE_SCANNING_ENABLED\` to \`true\` once"
            echo "code scanning is available. The scans still gate this build; no waiver has been"
            echo "granted, and one belongs in \`docs/process/waivers.md\` if this is still the state"
            echo "at the first release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate on the container definitions
        # Critical only, for now. The container misconfiguration rules have not been triaged against
        # these Dockerfiles yet, and a first run that fails on a rule nobody has read is how a gate
        # gets bypassed rather than fixed. Every finding at any severity is in the summary; once the
        # high-severity ones are fixed or waived this drops to 7.0 and stays there. It ratchets in
        # one direction, like the coverage floor.
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/sarif-gate.py artifacts/security/trivy/config.sarif
          --label "Trivy: container and infrastructure definitions"
          --fail-on-severity 9.0

      - name: Gate on the dependency tree
        # High and critical, with a fix available. This one is not provisional: a dependency with a
        # known, fixed, high-severity advisory is upgraded, or the upgrade is waived in writing.
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/sarif-gate.py artifacts/security/trivy/dependencies.sarif
          --label "Trivy: dependencies"
          --fail-on-severity 7.0

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Produces an artefact and nothing else.
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore and build
        # The .NET half of the bill of materials is read out of the `*.deps.json` files, which only
        # exist after a build: central package management keeps the versions in
        # Directory.Packages.props, and no lock file is committed for the cataloguer to read
        # instead. Without this step the document would list the client's dependencies, omit every
        # server dependency, and give no sign that it had — an incomplete bill of materials that
        # looks complete is worse than none.
        run: |
          dotnet restore HyFib.Tailor360.slnx
          dotnet build HyFib.Tailor360.slnx --configuration Release --no-restore

      - name: Prepare the output directory
        run: mkdir -p artifacts/sbom

      - name: Generate the bill of materials
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          # CycloneDX because that is what the vulnerability tooling downstream of a release reads.
          format: cyclonedx-json
          output-file: artifacts/sbom/tailor360.cyclonedx.json
          # The action's own artefact upload is turned off in favour of the pinned upload step
          # below, so every artefact in this workflow is produced the same way and retained for the
          # same period.
          upload-artifact: false
          # Posting the components to the dependency submission API needs the dependency graph,
          # which is the same unavailable feature the dependency review is gated on, and it needs a
          # write-scoped token this job deliberately does not have.
          dependency-snapshot: false
          # This workflow never runs on a release event; saying so explicitly keeps it that way if
          # a release trigger is added later without reading this job.
          upload-release-assets: false

      - name: Summarise the bill of materials
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import collections, json, os

          path = "artifacts/sbom/tailor360.cyclonedx.json"
          print("## Software bill of materials")
          print()
          if not os.path.exists(path):
              print("The document was not produced.")
              raise SystemExit(0)

          with open(path, encoding="utf-8") as handle:
              document = json.load(handle)

          components = document.get("components") or []
          ecosystems = collections.Counter(
              (component.get("purl") or "pkg:unknown/").split(":", 1)[1].split("/", 1)[0]
              for component in components
          )

          print(f"{len(components)} component(s), CycloneDX "
                f"{document.get('specVersion', 'unknown')}.")
          print()
          print("| Ecosystem | Components |")
          print("| --- | ---: |")
          for name, count in sorted(ecosystems.items()):
              print(f"| {name} | {count} |")
          print()
          print("Downloadable as the `sbom` artefact.")
          PY

      - name: Upload the bill of materials
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: artifacts/sbom/
          if-no-files-found: error
          retention-days: 14
