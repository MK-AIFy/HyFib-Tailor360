# HyFib Tailor360 — interim staging stack (issue #22, Lane C; hardened by #59).
#
# ACCESS IS GATED IN FRONT OF THIS STACK, NOT BY IT.
# Reaching the proxy requires both an IP allowlist for the shop networks and either an
# identity-aware proxy or WireGuard/Tailscale enrolment for phones and tablets; the application
# login is the second factor, never the only one. Until issue #23 (authentication) merges there is
# no public hostname at all: the proxy is published on the VM's loopback or WireGuard address and
# reached through the tunnel, which is why TAILOR360_BIND_ADDRESS defaults to 127.0.0.1 and why the
# Caddy site address is a bare port rather than a domain — TLS is terminated by the gate. When the
# hostname decision (Section 11 item 2) is taken, the ACME DNS-01 block in infra/caddy/Caddyfile is
# enabled and this file gains the hostname.
#
# The environment holds synthetic data only, no production secrets and no provider credentials:
# e-mail goes to Mailpit, and the payment, SMS and WhatsApp adapters stay on their fakes. It is
# deployed by the same pull-based tailor360-deploy script production will use (Section 4.7): verify
# the image signature, then `up -d --wait --pull always`, which runs the one-shot `migrate` service
# below before web and worker are allowed to serve. When that migration fails the environment is
# reset rather than repaired in place — `down -v`, `up`, then the `seed` profile — the run is
# labelled `staging-reset` and an issue is opened. A half-migrated staging database is worse than
# an empty one.
#
# Images are built once by CI and promoted by digest; nothing is built on the VM.
#   TAILOR360_WEB_IMAGE=ghcr.io/<owner>/tailor360-web@sha256:...
#   TAILOR360_WORKER_IMAGE=ghcr.io/<owner>/tailor360-worker@sha256:...
#   TAILOR360_CLI_IMAGE=ghcr.io/<owner>/tailor360-cli@sha256:...
#   docker compose -f infra/compose/docker-compose.staging.yml up -d --wait --pull always
#
# PostgreSQL, MinIO and ClamAV publish no ports at all: they are reachable only from the compose
# network. The worker's health port is internal for the same reason. Mailpit's interface is
# published on the gated address only, so that notification rehearsals can be inspected.
#
# The operating manual for this stack — provisioning, the reset sequence, the network gate, what the
# environment holds and what is still owed — is docs/dev/staging.md.

name: tailor360-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-app-hardening: &app-hardening
  # Section 4.7: non-root (set in the image), read-only root filesystem, no privilege escalation and
  # no capabilities. The hosts write nothing to disk: logs go to stdout, and the Data Protection key
  # ring is to live in platform.data_protection_keys — nothing persists it yet, so each container
  # holds an ephemeral ring today (docs/dev/staging.md section 12 item 4).
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  caddy:
    # A variable with the pinned stock image as its default. Enabling ACME DNS-01 needs a Caddy built
    # with the chosen provider's DNS module — the official image carries none — and that build is then
    # promoted by digest like every other image, rather than by editing this file on the VM.
    image: ${TAILOR360_CADDY_IMAGE:-caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      # A bare port: the network gate in front terminates TLS. Replaced by the hostname, and the
      # ACME DNS-01 block in the Caddyfile enabled, when #23 gives the environment a public name.
      TAILOR360_SITE_ADDRESS: ":8080"
      TAILOR360_UPSTREAM: "web:8080"
      # Belt and braces against the environment ever being reachable by a crawler: staging holds
      # synthetic data that must never appear in a search result.
      TAILOR360_ROBOTS_TAG: "noindex, nofollow, noarchive, nosnippet"
    ports:
      - "${TAILOR360_BIND_ADDRESS:-127.0.0.1}:${TAILOR360_STAGING_HTTP_PORT:-8080}:8080"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=/dev/null http://127.0.0.1:8080/api/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    # The site address is a port above 1024, so the proxy needs no capability at all. It is not
    # read-only: Caddy writes its certificate and configuration state into the two volumes.
    cap_drop:
      - ALL
    logging: *default-logging
    networks: [edge]

  web:
    image: ${TAILOR360_WEB_IMAGE:?set TAILOR360_WEB_IMAGE to the promoted image digest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      # The schema is at this build's level before the new version answers a single request, and the
      # deploy stops here if it is not. The application never migrates itself: during a deployment
      # two versions run at once and would race for the schema.
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_HTTP_PORTS: "8080"
      Secrets__Directory: /run/secrets
      # Staging's own Data Protection ring. Two things separate it from production: this environment
      # has its own database, and this discriminator, so a session cookie, anti-forgery token or
      # protected payload minted here cannot be decrypted there even if an image or a backup is
      # copied by mistake. The discriminator is declared now and takes effect when the persisted key
      # ring is configured against platform.data_protection_keys; until then each container holds an
      # ephemeral ring, because the root filesystem is read-only, and a restart signs staging users
      # out. Both are recorded in docs/dev/staging.md.
      Security__DataProtection__ApplicationName: tailor360-staging
      Observability__ServiceName: tailor360-web-staging
      Observability__OtlpEndpoint: ${TAILOR360_OTLP_ENDPOINT:-}
      Observability__TraceSamplingRatio: "1.0"
      Serilog__MinimumLevel__Default: ${TAILOR360_LOG_LEVEL:-Information}
      # Caddy is the only hop in front of the host and sits on the edge bridge network.
      ForwardedHeaders__KnownNetworks__0: "172.16.0.0/12"
      # Object storage and the scanner are bound from #31, declared now so the deployment shape does
      # not change when that issue lands. The e-mail keys are live: Identity binds them today, which is
      # why they carry its section verbatim.
      ObjectStorage__Endpoint: http://minio:9000
      ObjectStorage__ForcePathStyle: "true"
      MalwareScanner__Endpoint: tcp://clamav:3310
      Identity__Email__Host: mailpit
      Identity__Email__Port: "1025"
      # Required rather than defaulted: a recovery link built from the wrong origin is worse than a
      # stack that refuses to start, because it fails silently and only for the person locked out.
      Identity__Recovery__PublicBaseUrl: ${TAILOR360_STAGING_PUBLIC_ORIGIN:?set TAILOR360_STAGING_PUBLIC_ORIGIN to the address a browser reaches this deployment on}
      Identity__Recovery__AllowInsecurePublicBaseUrl: ${TAILOR360_STAGING_ALLOW_INSECURE_ORIGIN:-false}
    secrets:
      - Database__ConnectionString
      - ObjectStorage__AccessKey
      - ObjectStorage__SecretKey
    <<: *app-hardening
    tmpfs:
      - /tmp:mode=1777,size=64m
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging: *default-logging
    networks: [edge, backend]

  worker:
    image: ${TAILOR360_WORKER_IMAGE:?set TAILOR360_WORKER_IMAGE to the promoted image digest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      Secrets__Directory: /run/secrets
      # The same ring as the web host, and the same caveat — see the web service above.
      Security__DataProtection__ApplicationName: tailor360-staging
      Observability__ServiceName: tailor360-worker-staging
      Observability__OtlpEndpoint: ${TAILOR360_OTLP_ENDPOINT:-}
      Serilog__MinimumLevel__Default: ${TAILOR360_LOG_LEVEL:-Information}
      Worker__HealthPort: "8081"
      ObjectStorage__Endpoint: http://minio:9000
      ObjectStorage__ForcePathStyle: "true"
      MalwareScanner__Endpoint: tcp://clamav:3310
      Identity__Email__Host: mailpit
      Identity__Email__Port: "1025"
      # Required rather than defaulted: a recovery link built from the wrong origin is worse than a
      # stack that refuses to start, because it fails silently and only for the person locked out.
      Identity__Recovery__PublicBaseUrl: ${TAILOR360_STAGING_PUBLIC_ORIGIN:?set TAILOR360_STAGING_PUBLIC_ORIGIN to the address a browser reaches this deployment on}
      Identity__Recovery__AllowInsecurePublicBaseUrl: ${TAILOR360_STAGING_ALLOW_INSECURE_ORIGIN:-false}
    secrets:
      - Database__ConnectionString
      - ObjectStorage__AccessKey
      - ObjectStorage__SecretKey
    <<: *app-hardening
    tmpfs:
      - /tmp:mode=1777,size=64m
    healthcheck:
      # The worker's probes answer on the backend network only; nothing publishes 8081.
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8081/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging: *default-logging
    networks: [backend]

  migrate:
    # The one-shot migration step: run by `up` before web and worker may serve, and again by the
    # reset sequence after a failed deploy. Migrations are applied by the operator command line
    # rather than by the application, so that a deployment in which two versions overlap cannot have
    # them racing for the schema, and so that the migrator can hold a role the application does not.
    #
    # The image is the promoted tailor360-cli digest, built by the release pipeline from
    # infra/docker/Dockerfile.cli. That Dockerfile and the job that builds it are still owed — see
    # "Still owed" in docs/dev/staging.md.
    image: ${TAILOR360_CLI_IMAGE:?set TAILOR360_CLI_IMAGE to the promoted image digest}
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The command line reads DOTNET_ENVIRONMENT first and ASPNETCORE_ENVIRONMENT second. Naming
      # the environment here is what keeps appsettings.Development.json, and the development
      # connection string in it, out of the configuration this process builds.
      DOTNET_ENVIRONMENT: Staging
      Secrets__Directory: /run/secrets
    secrets:
      # The migrator holds t360_migrator once the per-role grants of Section 4.4 exist; today all
      # three processes read the same connection string.
      - Database__ConnectionString
    <<: *app-hardening
    tmpfs:
      - /tmp:mode=1777,size=64m
    healthcheck:
      # A one-shot has no steady state; dependants wait with service_completed_successfully.
      disable: true
    logging: *default-logging
    networks: [backend]

  init-reference-data:
    # Idempotent and production-safe: the audit partitions for the coming months and the reference
    # rows every installation needs. It sits under a profile because it belongs to provisioning and
    # to the reset sequence, not to every deploy:
    #   docker compose -f infra/compose/docker-compose.staging.yml \
    #     --profile seed run --rm init-reference-data
    profiles: ["seed"]
    image: ${TAILOR360_CLI_IMAGE:?set TAILOR360_CLI_IMAGE to the promoted image digest}
    command: ["init-reference-data"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Staging
      Secrets__Directory: /run/secrets
    secrets:
      - Database__ConnectionString
    <<: *app-hardening
    tmpfs:
      - /tmp:mode=1777,size=64m
    healthcheck:
      disable: true
    logging: *default-logging
    networks: [backend]

  seed-synthetic:
    # The deterministic synthetic dataset this environment holds, and the only dataset it is allowed
    # to hold. The command refuses to run when the environment resolves to Production, unconditionally
    # — there is no override flag and deliberately none, so the service cannot be pointed at a live
    # database by changing a variable.
    #   docker compose -f infra/compose/docker-compose.staging.yml \
    #     --profile seed run --rm seed-synthetic
    profiles: ["seed"]
    image: ${TAILOR360_CLI_IMAGE:?set TAILOR360_CLI_IMAGE to the promoted image digest}
    command: ["seed-synthetic"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Staging
      Secrets__Directory: /run/secrets
    secrets:
      - Database__ConnectionString
    <<: *app-hardening
    tmpfs:
      - /tmp:mode=1777,size=64m
    healthcheck:
      disable: true
    logging: *default-logging
    networks: [backend]

  postgres:
    # Digest as well as tag, like every third-party image in this file: a tag is a mutable pointer,
    # and staging is the environment a release is rehearsed in. Dependabot's `docker` ecosystem
    # raises these digests weekly.
    image: postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"
      - "-c"
      - "log_min_duration_statement=500"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tailor360}
      POSTGRES_USER: ${POSTGRES_USER:-tailor360}
      # A password never belongs in an environment block (Section 4.4); the image reads the file.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--data-checksums"
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No ports: the database is reachable only from the backend network. Administrative access is
    # over the WireGuard tunnel plus `docker compose exec`, which leaves an SSH audit trail.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB} --quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    networks: [backend]

  minio:
    # DIGEST OWED. Every other third-party image here carries `tag@sha256:...`; these two do not,
    # because quay.io was unreachable from the environment this file was last edited in and a
    # guessed digest that looks pinned is worse than an honest tag. Resolve and add both before the
    # first deployment:
    #   docker buildx imagetools inspect quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    # Tracked as item 9 in docs/dev/staging.md section 12.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # MinIO reads the _FILE variants so the root credentials stay out of the environment block.
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio-data:/data
    # No ports: neither the S3 API nor the console is published.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    networks: [backend]

  createbuckets:
    # Digest owed, for the same reason as `minio` above.
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    secrets:
      - minio_root_user
      - minio_root_password
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 \
          "$$(cat /run/secrets/minio_root_user)" \
          "$$(cat /run/secrets/minio_root_password)"
        mc mb --ignore-existing local/tailor360-media
        mc mb --ignore-existing local/tailor360-documents
        mc mb --ignore-existing local/tailor360-exports
        mc anonymous set none local/tailor360-media
        mc anonymous set none local/tailor360-documents
        mc anonymous set none local/tailor360-exports
        echo "buckets ready"
    restart: "no"
    healthcheck:
      disable: true
    logging: *default-logging
    networks: [backend]

  clamav:
    # Not behind a profile here: staging must exercise the real scanner, because that is where the
    # media pipeline of #31 is rehearsed before it reaches a shop.
    image: clamav/clamav:1.4.6@sha256:b25d9199257ae7ef45e0cc4c7eaa60ce7e5447796f0090d5ff311d1a30980cc3
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    # No ports: clamd is reachable only from the backend network.
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 180s
    logging: *default-logging
    networks: [backend]

  mailpit:
    # Staging has no provider credentials, so every notification lands here and nothing can reach a
    # real customer. The interface is published on the gated address only.
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${TAILOR360_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_UI_PUBLISHED_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks: [backend]

  otel-collector:
    # Optional here as well: with no OTLP endpoint configured the hosts export nothing, and the
    # telemetry backend is decided with Section 11 item 14 (D13).
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      # See docker-compose.yml: the image is built FROM scratch and holds no shell or HTTP client.
      disable: true
    logging: *default-logging
    networks: [backend]

networks:
  edge:
    name: tailor360-staging-edge
    driver: bridge
  backend:
    name: tailor360-staging-backend
    driver: bridge
    # Not `internal: true`: freshclam refreshes the ClamAV signature database and the collector ships
    # telemetry outward. The database and object storage are isolated by publishing no ports and by
    # keeping the proxy off this network, so the only route in is through the web host.

volumes:
  postgres-data:
    name: tailor360-staging-postgres-data
  minio-data:
    name: tailor360-staging-minio-data
  clamav-data:
    name: tailor360-staging-clamav-data
  mailpit-data:
    name: tailor360-staging-mailpit-data
  caddy-data:
    name: tailor360-staging-caddy-data
  caddy-config:
    name: tailor360-staging-caddy-config

secrets:
  # Files on the VM, root-owned and readable by the container user, placed by the deploy script from
  # the operator's secret store — never committed, never in an environment block.
  Database__ConnectionString:
    file: ${TAILOR360_STAGING_SECRETS_DIR:?set TAILOR360_STAGING_SECRETS_DIR}/Database__ConnectionString
  ObjectStorage__AccessKey:
    file: ${TAILOR360_STAGING_SECRETS_DIR:?set TAILOR360_STAGING_SECRETS_DIR}/ObjectStorage__AccessKey
  ObjectStorage__SecretKey:
    file: ${TAILOR360_STAGING_SECRETS_DIR:?set TAILOR360_STAGING_SECRETS_DIR}/ObjectStorage__SecretKey
  postgres_password:
    file: ${TAILOR360_STAGING_SECRETS_DIR:?set TAILOR360_STAGING_SECRETS_DIR}/postgres_password
  minio_root_user:
    file: ${TAILOR360_STAGING_SECRETS_DIR:?set TAILOR360_STAGING_SECRETS_DIR}/minio_root_user
  minio_root_password:
    file: ${TAILOR360_STAGING_SECRETS_DIR:?set TAILOR360_STAGING_SECRETS_DIR}/minio_root_password
